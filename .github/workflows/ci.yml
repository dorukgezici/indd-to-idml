name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked
      - run: npm test
      - run: ./indd-to-idml --help
      - run: node --check src/indd_to_idml/photopea.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify headless Chromium runtime
        run: node scripts/browser_smoke.mjs
      - name: Build Python distributions
        run: uv build
